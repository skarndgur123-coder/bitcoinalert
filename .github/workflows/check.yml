# Bitcoinalert 5-minute polling pipeline
# GitHub delays `schedule` by hours in practice, so an external cron (cron-job.org)
# calls workflow_dispatch every 5 minutes; `schedule` is kept only as a fallback.
name: check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bitcoinalert-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env and kakao token store from secrets
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_TOKEN_JSON: ${{ secrets.KAKAO_TOKEN_JSON }}
        run: |
          : > .env
          printf '%s\n' "KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY" >> .env
          printf '%s\n' "KAKAO_REDIRECT_URI=$KAKAO_REDIRECT_URI" >> .env
          printf '%s\n' "KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET" >> .env
          printf '%s\n' "KAKAO_TOKEN_STORE_PATH=secrets/kakao_token.json" >> .env
          mkdir -p secrets
          printf '%s' "$KAKAO_TOKEN_JSON" > secrets/kakao_token.json

      - name: Run check
        run: python run_check.py

      - name: Persist history
        if: always()
        run: |
          git config user.name  "bitcoin-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/history.db
          git diff --staged --quiet || git commit -m "chore: update history [skip ci]"
          git push
